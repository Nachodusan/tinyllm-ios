name: TinyLLM
options:
  bundleIdPrefix: ar.dusan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 2W9598J23L
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
packages:
  TinyLLMKit:
    path: .
targets:
  TinyLLM:
    type: application
    platform: iOS
    sources: [App/Sources]
    dependencies:
      - package: TinyLLMKit
        product: TinyLLMKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TinyLLM
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ar.dusan.tinyllm
        GENERATE_INFOPLIST_FILE: NO
